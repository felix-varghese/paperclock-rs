<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>paperclock-rs sample display (mockup, not a live photo)</title>

  <!-- e-ink panel background -->
  <rect x="0" y="0" width="960" height="540" fill="#f1efe6"/>
  <rect x="0.5" y="0.5" width="959" height="539" fill="none" stroke="#d8d5c8" stroke-width="1"/>

  <!-- Date -->
  <text x="480" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="32" fill="#161616">Tuesday, 15-09-2026</text>

  <!-- Clock -->
  <text x="480" y="355" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="180" font-weight="700" fill="#0e0e0e">14:32</text>

  <!-- Weather: icon + temperature, centered as a pair -->
  <g transform="translate(394, 445)">
    <!-- partly-cloudy glyph -->
    <circle cx="18" cy="16" r="12" fill="none" stroke="#161616" stroke-width="3"/>
    <path d="M2 34 h34 a11 11 0 0 0 0 -22 a14 14 0 0 0 -27 -4 a11 11 0 0 0 -7 26 z"
          fill="#f1efe6" stroke="#161616" stroke-width="3" stroke-linejoin="round"/>
    <text x="62" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#161616">22.5&#176;C</text>
  </g>

  <!-- WiFi: icon + signal strength, top-left -->
  <g transform="translate(20, 18)">
    <path d="M11 21 a3.2 3.2 0 1 1 0.1 0 z" fill="#161616"/>
    <path d="M4 14 a10 10 0 0 1 14 0" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
    <path d="M-1 8 a18 18 0 0 1 24 0" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="46" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161616">-58dBm</text>

  <!-- City, bottom-left -->
  <text x="20" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#161616">Amsterdam</text>

  <!-- Battery: icon + percentage, bottom-right -->
  <g>
    <rect x="790" y="498" width="36" height="20" fill="none" stroke="#161616" stroke-width="2.5"/>
    <rect x="826" y="505" width="4" height="6" fill="#161616"/>
    <rect x="793" y="501" width="23" height="14" fill="#161616"/>
    <text x="838" y="522" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#161616">76%</text>
  </g>
</svg>
